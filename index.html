<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NoteNest Workspace is a calm, local-first space for notes, docs, tasks and ideas.">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>NoteNest Workspace</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-action="home" aria-label="NoteNest home">
        <span class="brand-mark">n</span>
        <span class="brand-copy"><strong>NoteNest</strong><small>WORKSPACE</small></span>
      </a>
      <div class="workspace-switcher">
        <div class="workspace-avatar">N</div>
        <div class="workspace-name"><strong>My workspace</strong><small>Personal space</small></div>
        <span class="chevron">⌄</span>
      </div>
      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span> Home</button>
        <button class="nav-item" data-view="all"><span class="nav-icon">▤</span> All pages <span class="nav-count" id="page-count">0</span></button>
        <button class="nav-item" data-view="favorites"><span class="nav-icon">☆</span> Favorites</button>
        <button class="nav-item" data-view="databases"><span class="nav-icon">▦</span> Databases</button>
        <button class="nav-item" data-action="open-search"><span class="nav-icon">⌕</span> Search <kbd>⌘ K</kbd></button>
      </nav>
      <div class="sidebar-section">
        <div class="section-head"><span>YOUR PAGES</span><button class="icon-button tiny" data-action="new-page" title="Create a page" aria-label="Create a page">＋</button></div>
        <div class="page-tree" id="page-tree"></div>
      </div>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="trash"><span class="nav-icon">▱</span> Trash</button>
        <button class="nav-item" data-action="open-settings"><span class="nav-icon">⚙</span> Settings & backup</button>
        <div class="sidebar-branding"><span class="online-dot"></span> Saved on this device<br><a href="https://infioffice.com" target="_blank" rel="noopener noreferrer">Made by InfiOffice ↗</a></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumbs" id="breadcrumbs"><span>My workspace</span><span class="crumb-sep">/</span><strong>Home</strong></div>
        <div class="topbar-actions">
          <button class="top-search" data-action="open-search"><span>⌕</span><span>Search anything...</span><kbd>Ctrl K</kbd></button>
          <button class="icon-button" data-action="toggle-theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
          <button class="avatar-button" data-action="open-settings" title="Workspace settings" aria-label="Workspace settings">N</button>
        </div>
      </header>
      <section class="view" id="view" tabindex="-1"></section>
    </main>
  </div>

  <input type="file" id="import-file" accept=".json,.md,.markdown,.txt" hidden>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><div><p class="eyebrow" id="modal-kicker">WORKSPACE</p><h2 id="modal-title">Search</h2></div><button class="icon-button" data-action="close-modal" aria-label="Close">×</button></div>
      <div id="modal-content"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./cloud-config.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./cloud.js" defer></script>
</body>
</html>
